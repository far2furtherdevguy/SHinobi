<script>

const H=14,HW=45,CH=[0x35c8ff,0xff4d6d,0xffc933,0x7dff6a],CS=['#35c8ff','#ff4d6d','#ffc933','#7dff6a'];

const scene=new THREE.Scene();scene.fog=new THREE.Fog(0xcfeaff,70,190);
const cam=new THREE.PerspectiveCamera(78,innerWidth/innerHeight,.1,500);cam.rotation.order='YXZ';scene.add(cam);
const ren=new THREE.WebGLRenderer({antialias:true});ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.setSize(innerWidth,innerHeight);document.body.prepend(ren.domElement);ren.shadowMap.enabled=true;ren.shadowMap.type=THREE.PCFSoftShadowMap;
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});
function tex(fn,rx,ry,sz){const c=document.createElement('canvas');c.width=c.height=sz||256;const g=c.getContext('2d');fn(g);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);t.anisotropy=4;return t}
const nz=(g,n,a,c)=>{for(let i=0;i<n;i++){g.fillStyle=`rgba(${c||'0,0,0'},${Math.random()*a})`;g.fillRect(Math.random()*256,Math.random()*256,2,2)}};
const groundT=tex(g=>{g.fillStyle='#d9d4c4';g.fillRect(0,0,256,256);nz(g,3000,.08);g.strokeStyle='#b9b29c';g.lineWidth=3;g.strokeRect(0,0,256,256);g.strokeStyle='#cbc5b0';g.lineWidth=1;g.strokeRect(128,0,1,256);g.strokeRect(0,128,256,1)},30,30);
const stuccoT=tex(g=>{g.fillStyle='#f4f6f8';g.fillRect(0,0,256,256);nz(g,2500,.06);g.fillStyle='#2a7fd4';g.fillRect(24,90,80,70);g.fillRect(152,90,80,70);g.fillStyle='#bfe6ff';g.fillRect(30,96,68,58);g.fillRect(158,96,68,58);g.fillStyle='#ffc933';g.fillRect(0,236,256,20)},2,1);
const crateT=tex(g=>{g.fillStyle='#3d8fe0';g.fillRect(0,0,256,256);nz(g,3000,.1);g.strokeStyle='#e8f4ff';g.lineWidth=10;g.strokeRect(5,5,246,246);g.lineWidth=5;g.beginPath();g.moveTo(10,10);g.lineTo(246,246);g.moveTo(246,10);g.lineTo(10,246);g.stroke()},1,1);
const contT=tex(g=>{g.fillStyle='#ffc933';g.fillRect(0,0,256,256);nz(g,3000,.1);g.fillStyle='#d9a400';for(let i=0;i<16;i++)g.fillRect(i*16,0,7,256)},3,1);
const hexT=tex(g=>{g.fillStyle='#e9eef3';g.fillRect(0,0,256,256);nz(g,2000,.06);g.strokeStyle='#1e90ff';g.lineWidth=4;g.strokeRect(10,10,236,236);g.fillStyle='#1e90ff';g.fillRect(0,120,256,16)},1,1);
const mat=(t,r,m)=>new THREE.MeshStandardMaterial({map:t,bumpMap:t,bumpScale:.35,roughness:r||.85,metalness:m||.1});
// sky, sea, mountains
const THEMES=[{n:'Day',sky:['#2f8fff','#8fd0ff','#eaf7ff'],fog:0xcfeaff,fd:[70,190],hs:0xdff2ff,hg:0xcdbb90,hi:.95,sc:0xfff0cc,si:.9,sp:[30,60,20],sea:0x1fa6dc,sd:[150,200,100],sdc:0xfff2b0,cl:0xffffff,lamp:0},
 {n:'Sunset',sky:['#3b2a6e','#ff7a59','#ffd3a0'],fog:0xf0b58a,fd:[50,160],hs:0xffc9a0,hg:0x6a4a5a,hi:.8,sc:0xff9a5a,si:1,sp:[-60,25,30],sea:0xc8603a,sd:[-200,60,120],sdc:0xffb070,cl:0xffc8a8,lamp:1},
 {n:'Night',sky:['#050816','#0b1840','#1c2e66'],fog:0x0b1430,fd:[30,120],hs:0x5a78c8,hg:0x151a2a,hi:.6,sc:0x8fa8ff,si:.5,sp:[30,60,-20],sea:0x0a2a50,sd:[-120,180,-150],sdc:0xdfe8ff,cl:0x30384f,lamp:2}];
const skyC=document.createElement('canvas');skyC.width=skyC.height=256;
function drawSky(c){const g=skyC.getContext('2d'),gr=g.createLinearGradient(0,0,0,256);gr.addColorStop(0,c[0]);gr.addColorStop(.5,c[1]);gr.addColorStop(1,c[2]);g.fillStyle=gr;g.fillRect(0,0,256,256)}
drawSky(THEMES[0].sky);
const sky=new THREE.Mesh(new THREE.SphereGeometry(300,16,8),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(skyC),side:THREE.BackSide,fog:false}));scene.add(sky);
const waveT=tex(g=>{g.fillStyle='#ffffff';g.fillRect(0,0,256,256);for(let i=0;i<220;i++){g.strokeStyle=`rgba(120,200,255,${.15+Math.random()*.3})`;g.lineWidth=2;const x=Math.random()*256,y=Math.random()*256;g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+12,y-6,x+26,y);g.stroke()}},50,50);
const sea=new THREE.Mesh(new THREE.PlaneGeometry(900,900),new THREE.MeshStandardMaterial({color:0x1fa6dc,map:waveT,roughness:.2,metalness:.3}));sea.rotation.x=-Math.PI/2;sea.position.y=-.7;scene.add(sea);
[[-95,-130,45,70],[60,-140,50,80],[130,60,35,50],[-120,80,40,55]].forEach(([x,z,r,h])=>{const m=new THREE.Mesh(new THREE.ConeGeometry(r,h,7),new THREE.MeshStandardMaterial({color:0x7f9fc0,flatShading:true}));m.position.set(x,h/2-2,z);scene.add(m)});
const floor=new THREE.Mesh(new THREE.PlaneGeometry(HW*2,HW*2),mat(groundT,.9));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const hemi=new THREE.HemisphereLight(0xdff2ff,0xcdbb90,.95);scene.add(hemi);const sun=new THREE.DirectionalLight(0xfff0cc,.9);sun.position.set(30,60,20);scene.add(sun);{const sc=sun.shadow.camera;sc.left=-62;sc.right=62;sc.top=62;sc.bottom=-62;sc.near=1;sc.far=200;sun.shadow.mapSize.set(2048,2048);sc.updateProjectionMatrix()}
const obs=[],AB=[],emis=c=>new THREE.MeshBasicMaterial({color:c});
const stM=mat(stuccoT),cm=mat(crateT,.6,.2),km=mat(contT,.5,.3),hubM=mat(hexT,.6,.2),roofM=new THREE.MeshStandardMaterial({color:0xf2c230,roughness:.7}),glassM=new THREE.MeshStandardMaterial({color:0x9fdcff,transparent:true,opacity:.3,roughness:.1}),iceM=new THREE.MeshStandardMaterial({color:0x8fdcff,transparent:true,opacity:.7,roughness:.1,emissive:0x2a6a9a});
function box(x,z,w,d,h,m,col,y0=0){const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);b.position.set(x,y0+h/2,z);b.castShadow=b.receiveShadow=true;scene.add(b);obs.push(b);const ab={x0:x-w/2,x1:x+w/2,z0:z-d/2,z1:z+d/2,y0,t:y0+h};AB.push(ab);let s=null;
 if(col){s=new THREE.Mesh(new THREE.BoxGeometry(w+.04,.1,d+.04),emis(col));s.position.set(x,y0+h-.05,z);scene.add(s)}return{b,ab,s}}
function rm(o){scene.remove(o.b);if(o.s)scene.remove(o.s);obs.splice(obs.indexOf(o.b),1);AB.splice(AB.indexOf(o.ab),1)}
const BL=0x1e90ff,YL=0xffc933,WH=0xffffff;
[[0,-45.5,92,1],[0,45.5,92,1],[-45.5,0,1,92],[45.5,0,1,92]].forEach(([x,z,w,d])=>box(x,z,w,d,4,glassM,YL));

box(0,0,8,8,3.6,hubM,BL);
for(const s of[-1,1])for(let k=0;k<5;k++)box(0,s*(4.5+k),3,1,3-.6*k,cm,k%2?YL:BL);
for(const s of[-1,1]){box(s*3.85,0,.3,8,1,hubM,BL,3.6);for(const q of[-1,1])box(q*2.75,s*3.85,2.5,.3,1,hubM,BL,3.6)}

 for(const s of[-1,1]){const z=cz+s*(d/2-t/2);if(door!=='z'+(s>0?'p':'m'))seg(cx,z,w,t);else{const sw=(w-g)/2;seg(cx-(g/2+sw/2),z,sw,t);seg(cx+(g/2+sw/2),z,sw,t)}}
